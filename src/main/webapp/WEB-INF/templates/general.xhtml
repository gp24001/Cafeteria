<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces" xmlns:f="jakarta.faces.core">
    <f:metadata><ui:insert name="metadata"/></f:metadata>
    <h:head>
        <title>CAFEFE</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" type="text/css" href="#{request.contextPath}/resources/css/general.css?v=20261107-3"/>
    </h:head>
    <h:body>
        <div class="general">
            <!-- BARRA LATERAL -->
            <aside class="barraLateral">
                <!-- LOGO -->
                <div class="aplicacion">
                    <h:graphicImage library="imagenes" name="logo.jpg" styleClass="logo"/>
                    <h1>CAFEFE</h1>
                </div>
                <!-- CATALOGO -->
                <div class="catalogo">
                    <h:form id="formMenu">
                        <p:menuButton id="menuCatalogo" value="Catálogo" maxHeight="45vh" collision="fit"
                                      rendered="#{accesoModel.permite('Orden') or accesoModel.permite('Factura') or accesoModel.permite('Empleado')}">
                            <p:menuitem value="Empleado" url="Empleado.jsf" rendered="#{accesoModel.permite('Empleado')}"/>
                            <p:menuitem value="Rol" url="Rol.jsf" rendered="#{accesoModel.permite('Rol')}"/>
                            <p:menuitem value="Característica" url="Caracteristica.jsf" rendered="#{accesoModel.permite('Caracteristica')}"/>
                            <p:menuitem value="Producto" url="Producto.jsf" rendered="#{accesoModel.permite('Producto')}"/>
                            <p:menuitem value="Descuento" url="Descuento.jsf" rendered="#{accesoModel.permite('Descuento')}"/>
                            <p:menuitem value="Orden" url="Orden.jsf" rendered="#{accesoModel.permite('Orden')}"/>
                            <p:menuitem value="TipoCaracterística" url="TipoCaracteristica.jsf" rendered="#{accesoModel.permite('TipoCaracteristica')}"/>
                            <p:menuitem value="TipoProducto" url="TipoProducto.jsf" rendered="#{accesoModel.permite('TipoProducto')}"/>
                            <p:menuitem value="TipoDescuento" url="TipoDescuento.jsf" rendered="#{accesoModel.permite('TipoDescuento')}"/>
                            <p:menuitem value="Caja" url="Caja.jsf" rendered="#{accesoModel.permite('Caja')}"/>
                            <p:menuitem value="Facturación y cobros" url="Factura.jsf" rendered="#{accesoModel.permite('Factura')}"/>
                        </p:menuButton>
                        <h:panelGroup rendered="#{accesoModel.autenticado}" layout="block" styleClass="sesionUsuario">
                            <h:outputText value="#{accesoModel.nombreEmpleado}"/>
                            <p:commandButton value="Cerrar sesión" action="#{accesoModel.salir}"
                                             ajax="false" process="@this" immediate="true"/>
                        </h:panelGroup>
                    </h:form>
                </div>
            </aside>
            <!-- ZONA PRINCIPAL -->
            <main class="zonaPrincipal">
                <!-- TITULO -->
                <header class="tituloContenedor">
                    <h1 class="tituloPagina">
                    #{empty tituloPagina ? 'CAFEFE' : tituloPagina}
                </h1>
                </header>
                <!-- CONTENIDO -->
                <div class="contenido">
                    <div class="panel">
                        <ui:insert name="contenido"/>
                    </div>
                </div>
            </main>
        </div>
    </h:body>
</html>
