<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:bo="jakarta.faces.composite/botones"
    xmlns:ta="jakarta.faces.composite/tablas"
    template="/WEB-INF/templates/general.xhtml">
    <ui:param name="modelo" value="#{ordenModel}"/>
    <ui:param name="tituloPagina" value="Orden"/>
    <ui:define name="contenido">
        <h:form id="formTabla">
            <p:growl id="growl" showDetail="false" life="6000"/>
            <div class="crud-botones">
                <bo:botonesArriba modelo="#{modelo}"/>
            </div>
            <h:panelGroup
                id="panelFormulario"
                layout="block"
                rendered="#{modelo.estado != 'NINGUNO'}"
                styleClass="formularioBloque">
                <h2 class="crud-subtitulo">Datos de la orden</h2>
                <p:tabView id="tabs" activeIndex="#{modelo.tabActivo}">
                    <p:ajax event="tabChange" process="@this" update=":formTabla:panelDescuentos"/>
                    <p:tab title="Generalidades">
                        <!-- Al agregar productos se procesa este panel para conservar empleado y fecha. -->
                        <h:panelGroup id="datosGenerales" layout="block" styleClass="formGrid">
                            <div class="campoGrupo">
                                <p:outputLabel for="id" value="ID:"/>
                                <p:inputText
                                    id="id"
                                    value="#{modelo.registro.idOrden}"
                                    readonly="true"
                                    styleClass="inputCompleto"/>
                            </div>
                            <div class="campoGrupo">
                                <p:outputLabel for="empleado" value="Empleado (camarero):"/>
                                <p:selectOneMenu
                                    id="empleado"
                                    value="#{modelo.idEmpleadoRolSeleccionado}"
                                    converter="uuidConverter"
                                    required="true"
                                    requiredMessage="Debe seleccionar un camarero"
                                    disabled="#{modelo.estado == 'EDITAR'}"
                                    filter="true"
                                    filterMatchMode="contains"
                                    filterPlaceholder="Buscar camarero..."
                                    height="88"
                                    panelStyleClass="buscadorCompacto">
                                    <f:selectItem
                                        itemLabel="Buscar o seleccionar camarero..."
                                        itemValue="#{null}"
                                        noSelectionOption="true"/>
                                    <f:selectItems
                                        value="#{modelo.camareros}"
                                        var="e"
                                        itemValue="#{e.idEmpleadoRol}"
                                        itemLabel="#{e.idEmpleado.nombre} #{e.idEmpleado.apellido}"/>
                                    <p:ajax process="@this"/>
                                </p:selectOneMenu>
                            </div>
                            <div class="campoGrupo">
                                <p:outputLabel for="fecha" value="Fecha de orden:"/>
                                <p:datePicker
                                    id="fecha"
                                    value="#{modelo.registro.fechaOrden}"
                                    showTime="true"
                                    pattern="dd/MM/yyyy HH:mm"
                                    hourFormat="24"
                                    timeZone="America/El_Salvador"
                                    required="true"
                                    requiredMessage="La fecha es obligatoria"
                                    disabled="#{modelo.estado == 'EDITAR'}"
                                    styleClass="inputCompleto">
                                    <p:ajax
                                        event="dateSelect"
                                        listener="#{modelo.cambiarFecha}"
                                        process="@this"
                                        update=":formTabla:tabs:tablaLineas :formTabla:panelDescuentos :formTabla:resumenTotal"/>
                                    <p:ajax
                                        event="change"
                                        listener="#{modelo.cambiarFecha}"
                                        process="@this"
                                        update=":formTabla:tabs:tablaLineas :formTabla:panelDescuentos :formTabla:resumenTotal"/>
                                </p:datePicker>
                            </div>
                            <div class="campoGrupo">
                                <p:outputLabel for="observacion" value="Observación:"/>
                                <p:inputTextarea
                                    id="observacion"
                                    value="#{modelo.registro.observacion}"
                                    rows="3"
                                    styleClass="inputCompleto"/>
                            </div>
                        </h:panelGroup>
                    </p:tab>
                    <p:tab title="Productos">
                        <div class="formGrid">
                            <div class="campoGrupo">
                                <p:outputLabel for="productoSel" value="Producto:"/>
                                <p:selectOneMenu
                                    id="productoSel"
                                    value="#{modelo.idProductoSeleccionado}"
                                    converter="uuidConverter"
                                    disabled="#{modelo.estado == 'EDITAR'}"
                                    filter="true"
                                    filterMatchMode="contains"
                                    filterPlaceholder="Buscar producto..."
                                    height="88"
                                    panelStyleClass="buscadorCompacto">
                                    <f:selectItem
                                        itemLabel="Buscar o seleccionar producto..."
                                        itemValue="#{null}"
                                        noSelectionOption="true"/>
                                    <f:selectItems
                                        value="#{modelo.productos}"
                                        var="pr"
                                        itemValue="#{pr.idProducto}"
                                        itemLabel="#{pr.nombre} - $#{pr.precioSugerido}"/>
                                </p:selectOneMenu>
                            </div>
                            <p:commandButton
                                value="Agregar producto"
                                actionListener="#{modelo.agregarProducto}"
                                disabled="#{modelo.estado == 'EDITAR'}"
                                process="@this :formTabla:tabs:datosGenerales :formTabla:tabs:productoSel"
                                update="@form"/>
                        </div>
                        <p>Seleccione una fila para consultar los descuentos de ese producto.</p>
                        <p:dataTable
                            id="tablaLineas"
                            var="l"
                            value="#{modelo.lineas}"
                            selectionMode="single"
                            selection="#{modelo.lineaSeleccionada}"
                            rowKey="#{l.idOrdenProducto}"
                            emptyMessage="Agregue un producto a la orden"
                            styleClass="tablaGeneral">
                            <p:ajax
                                event="rowSelect"
                                listener="#{modelo.seleccionarLinea}"
                                process="@this :formTabla:tabs:datosGenerales"
                                update=":formTabla:panelDescuentos :formTabla:growl"/>
                            <p:column headerText="Producto">
                                <h:outputText value="#{l.idProducto.nombre}"/>
                            </p:column>
                            <p:column headerText="Importe">
                                <h:outputText value="#{l.precio}">
                                    <f:convertNumber type="currency" currencySymbol="$"/>
                                </h:outputText>
                            </p:column>
                            <p:column headerText="Descuentos y observaciones">
                                <h:outputText value="#{l.observaciones}"/>
                            </p:column>
                            <p:column headerText="Quitar" style="width:6rem">
                                <p:commandButton
                                    icon="pi pi-trash"
                                    title="Quitar producto"
                                    action="#{modelo.quitarLinea(l)}"
                                    disabled="#{modelo.estado == 'EDITAR'}"
                                    process="@this :formTabla:tabs:datosGenerales"
                                    update="@form"/>
                            </p:column>
                        </p:dataTable>
                    </p:tab>
                </p:tabView>
                <!-- La selección es de una línea, no de todos los productos de la orden. -->
                <h:panelGroup id="panelDescuentos" layout="block">
                    <h:panelGroup
                        layout="block"
                        rendered="#{modelo.estado == 'NUEVO' and modelo.tabActivo == 1 and modelo.lineaSeleccionada != null}">
                        <h:outputText
                            styleClass="seleccionProducto"
                            value="#{modelo.lineaSeleccionada.idProducto.nombre}"/>
                        <h:panelGroup rendered="#{empty modelo.descuentosAplicables}">
                            <p>Este producto no tiene descuentos disponibles para la fecha de la orden.</p>
                        </h:panelGroup>
                        <h:panelGroup
                            layout="block"
                            styleClass="formGrid"
                            rendered="#{not empty modelo.descuentosAplicables}">
                            <div class="campoGrupo">
                                <p:outputLabel for="descuentoSel" value="Descuento del producto:"/>
                                <p:selectOneMenu
                                    id="descuentoSel"
                                    value="#{modelo.idDescuentoSeleccionado}"
                                    converter="uuidConverter"
                                    filter="true"
                                    filterMatchMode="contains"
                                    filterPlaceholder="Buscar descuento..."
                                    height="88"
                                    panelStyleClass="buscadorCompacto">
                                    <f:selectItem
                                        itemLabel="Buscar o seleccionar descuento..."
                                        itemValue="#{null}"
                                        noSelectionOption="true"/>
                                    <f:selectItems
                                        value="#{modelo.descuentosAplicables}"
                                        var="d"
                                        itemValue="#{d.idDescuento}"
                                        itemLabel="#{d.nombre}"/>
                                </p:selectOneMenu>
                                <h:outputText value="La fecha de la orden se comprueba al aplicar el descuento."/>
                            </div>
                            <p:commandButton
                                value="Aplicar a este producto"
                                actionListener="#{modelo.aplicarDescuento}"
                                process="@this :formTabla:descuentoSel :formTabla:tabs:datosGenerales"
                                update=":formTabla:tabs:tablaLineas :formTabla:growl :formTabla:resumenTotal"/>
                        </h:panelGroup>
                    </h:panelGroup>
                </h:panelGroup>
                <h:panelGroup id="resumenTotal" layout="block" styleClass="seleccionProducto">
                    <h:outputText value="Total: "/>
                    <h:outputText value="#{modelo.total}">
                        <f:convertNumber type="currency" currencySymbol="$"/>
                    </h:outputText>
                </h:panelGroup>
            </h:panelGroup>
            <h:panelGroup
                id="panelTabla"
                layout="block"
                rendered="#{modelo.estado == 'NINGUNO'}"
                styleClass="tablaContenedor">
                <ta:tablaGeneral modelo="#{modelo}" filas="5" opcionesFilas="2,5,10,20">
                    <p:column headerText="ID" filterable="false">
                        <h:outputText value="#{r.idOrden}"/>
                    </p:column>
                    <p:column headerText="Camarero" filterable="false">
                        <h:outputText
                            value="#{r.idEmpleadoRol.idEmpleado.nombre} #{r.idEmpleadoRol.idEmpleado.apellido}"/>
                    </p:column>
                    <p:column headerText="Fecha" filterable="false">
                        <h:outputText value="#{r.fechaOrden}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                        </h:outputText>
                    </p:column>
                    <p:column
                        headerText="Observación"
                        field="observacion"
                        filterBy="#{r.observacion}"
                        filterMatchMode="contains">
                        <h:outputText value="#{r.observacion}"/>
                    </p:column>
                </ta:tablaGeneral>
            </h:panelGroup>
        </h:form>
    </ui:define>
</ui:composition>
