<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:bo="jakarta.faces.composite/botones"
    xmlns:ta="jakarta.faces.composite/tablas"
    template="/WEB-INF/templates/general.xhtml">
    <ui:param name="modelo" value="#{productoModel}"/>
    <ui:param name="tituloPagina" value="Producto"/>
    <ui:define name="contenido">
        <h:form id="formProducto">
            <p:growl id="growl" showDetail="false" life="5000"/>
            <h:panelGroup id="resumenProducto" layout="block">
                <h:panelGroup rendered="#{modelo.seleccionado != null}">
                    <h:outputText value="#{modelo.seleccionado.nombre}"/>
                </h:panelGroup>
            </h:panelGroup>
            <!-- El índice pertenece al bean ViewScoped. Cada sección mantiene su
                 formulario y solo consulta las asignaciones del producto elegido.
                 Guardar una asignación no ejecuta cancelar sobre productoModel. -->
            <p:tabView id="tabsProducto" activeIndex="#{modelo.pestanaActiva}">
                <p:ajax event="tabChange" process="@this"/>
                <!-- =========================
                     GENERALIDADES
                     ========================= -->
                <p:tab title="Generalidades">
                    <h:panelGroup id="seccionGeneral" layout="block">
                        <div class="crud-botones">
                            <p:commandButton
                                value="Nuevo Producto"
                                action="#{modelo.nuevo}"
                                process="@this"
                                update="@form"
                                rendered="#{modelo.estado == 'NINGUNO'}"/>
                            <p:commandButton
                                value="Guardar"
                                action="#{modelo.guardar}"
                                process="@this :formProducto:tabsProducto:panelFormularioProducto"
                                update="@form"
                                rendered="#{modelo.estado == 'NUEVO'}"/>
                            <p:commandButton
                                value="Guardar"
                                action="#{modelo.guardar}"
                                process="@this :formProducto:tabsProducto:panelFormularioProducto"
                                update=":formProducto:tabsProducto:seccionGeneral :formProducto:resumenProducto :formProducto:growl"
                                rendered="#{modelo.estado == 'EDITAR'}"/>
                            <p:commandButton
                                value="Cancelar"
                                action="#{modelo.cancelar}"
                                process="@this"
                                update="@form"
                                immediate="true"
                                resetValues="true"
                                rendered="#{modelo.estado != 'NINGUNO'}"/>
                            <p:commandButton
                                value="Eliminar"
                                action="#{modelo.eliminar(modelo.seleccionado)}"
                                process="@this"
                                update="@form"
                                rendered="#{modelo.estado == 'EDITAR'}"/>
                        </div>
                        <!-- FORMULARIO PRODUCTO -->
                        <h:panelGroup
                            id="panelFormularioProducto"
                            layout="block"
                            rendered="#{modelo.estado != 'NINGUNO'}"
                            styleClass="formularioBloque">
                            <h2 class="crud-subtitulo">Datos del Producto</h2>
                            <div class="formGrid">
                                <!-- NOMBRE -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="nombre" value="Nombre:"/>
                                    <p:inputText
                                        id="nombre"
                                        value="#{modelo.registro.nombre}"
                                        required="true"
                                        requiredMessage="El nombre es obligatorio"
                                        maxlength="150"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- PRECIO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="precioSugerido" value="Precio sugerido:"/>
                                    <p:inputNumber
                                        id="precioSugerido"
                                        maxValue="999999.99"
                                        value="#{modelo.registro.precioSugerido}"
                                        required="true"
                                        requiredMessage="El precio sugerido es obligatorio"
                                        decimalPlaces="2"
                                        minValue="0.01"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- COMENTARIOS -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="activo" value="Activo:"/>
                                    <div class="checkboxContenedor">
                                        <p:selectBooleanCheckbox id="activo" value="#{modelo.registro.activo}"/>
                                    </div>
                                </div>
                                <div class="campoGrupo">
                                    <p:outputLabel for="comentarios" value="Comentarios:"/>
                                    <p:inputTextarea
                                        id="comentarios"
                                        value="#{modelo.registro.comentarios}"
                                        rows="3"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- ACTIVO -->
                            </div>
                        </h:panelGroup>
                        <!-- TABLA PRODUCTOS -->
                        <h:panelGroup
                            id="panelTablaProducto"
                            layout="block"
                            rendered="#{modelo.estado == 'NINGUNO'}"
                            styleClass="tablaContenedor">
                            <ta:tablaGeneral
                                modelo="#{modelo}"
                                filas="5"
                                opcionesFilas="2,5,10,20"
                                actualizar="@form">
                                <p:column headerText="ID" filterable="false">
                                    <h:outputText value="#{r.idProducto}"/>
                                </p:column>
                                <p:column
                                    headerText="Nombre"
                                    field="nombre"
                                    filterBy="#{r.nombre}"
                                    filterMatchMode="contains"
                                    filterPlaceholder="Buscar por nombre">
                                    <h:outputText value="#{r.nombre}"/>
                                </p:column>
                                <p:column headerText="Precio sugerido" filterable="false">
                                    <h:outputText value="#{r.precioSugerido}">
                                        <f:convertNumber type="currency" currencySymbol="$"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Estado" filterable="false">
                                    <h:outputText
                                        value="#{r.activo ? 'ACTIVO' : 'INACTIVO'}"
                                        styleClass="#{r.activo ? 'estadoActivo' : 'estadoInactivo'}"/>
                                </p:column>
                                <p:column headerText="Comentarios" filterable="false">
                                    <h:outputText value="#{r.comentarios}"/>
                                </p:column>
                            </ta:tablaGeneral>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:tab>
                <!-- =========================
                     TIPOS
                     ========================= -->
                <p:tab title="Tipos">
                    <h:panelGroup id="seccionTipo" layout="block">
                        <p:commandButton
                            value="Nueva asignación"
                            action="#{tipoProductoModel.asignacionesProducto.nuevo}"
                            process="@this"
                            update=":formProducto:tabsProducto:seccionTipo :formProducto:resumenProducto :formProducto:growl"
                            resetValues="true"
                            rendered="#{modelo.seleccionado != null}"/>
                        <!-- FORMULARIO PRODUCTO TIPO PRODUCTO -->
                        <h:panelGroup
                            id="panelFormularioTipo"
                            layout="block"
                            rendered="#{tipoProductoModel.asignacionesProducto.estado != 'NINGUNO'}"
                            styleClass="formularioBloque">
                            <h2 class="crud-subtitulo">Tipo del Producto</h2>
                            <div class="formGrid">
                                <!-- ID PRODUCTO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="idProductoAsignacion" value="ID Producto:"/>
                                    <p:inputText
                                        id="idProductoAsignacion"
                                        value="#{tipoProductoModel.asignacionesProducto.registro.idProducto.idProducto}"
                                        readonly="true"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- TIPO PRODUCTO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="tipoSeleccionado" value="Tipo de producto:"/>
                                    <p:selectOneMenu
                                        id="tipoSeleccionado"
                                        value="#{tipoProductoModel.asignacionesProducto.idCatalogoSeleccionado}"
                                        converter="uuidConverter"
                                        filter="true"
                                        filterMatchMode="contains"
                                        filterPlaceholder="Buscar..."
                                        height="88"
                                        panelStyleClass="buscadorCompacto"
                                        disabled="#{tipoProductoModel.asignacionesProducto.estado != 'NUEVO'}"
                                        required="true"
                                        requiredMessage="Debe seleccionar un tipo de producto">
                                        <f:selectItem
                                            itemLabel="Buscar o seleccionar..."
                                            itemValue="#{null}"
                                            noSelectionOption="true"/>
                                        <f:selectItems
                                            value="#{tipoProductoModel.asignacionesProducto.disponibles}"
                                            var="tipo"
                                            itemValue="#{tipo.idTipoProducto}"
                                            itemLabel="#{tipo.nombre}"
                                            itemDisabled="#{!tipo.activo}"/>
                                        <p:ajax process="@this" update=":formProducto:growl"/>
                                    </p:selectOneMenu>
                                </div>
                                <!-- FECHA CREACIÓN -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="fechaCreacionTipo" value="Fecha de creación:"/>
                                    <p:inputText
                                        id="fechaCreacionTipo"
                                        value="#{tipoProductoModel.asignacionesProducto.registro.fechaCreacion}"
                                        readonly="true"
                                        styleClass="inputCompleto">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                                    </p:inputText>
                                </div>
                                <!-- ACTIVO -->
                                <!-- OBSERVACIONES -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="activoTipo" value="Activo:"/>
                                    <div class="checkboxContenedor">
                                        <p:selectBooleanCheckbox
                                            id="activoTipo"
                                            value="#{tipoProductoModel.asignacionesProducto.registro.activo}"/>
                                    </div>
                                </div>
                                <div class="campoGrupo">
                                    <p:outputLabel for="observacionesTipo" value="Observaciones:"/>
                                    <p:inputTextarea
                                        id="observacionesTipo"
                                        value="#{tipoProductoModel.asignacionesProducto.registro.observaciones}"
                                        rows="3"
                                        styleClass="inputCompleto"/>
                                </div>
                            </div>
                            <!-- BOTONES DEL TIPO -->
                            <div class="botonesCrud">
                                <p:commandButton
                                    value="Guardar Tipo"
                                    action="#{tipoProductoModel.asignacionesProducto.guardar}"
                                    process="@this :formProducto:tabsProducto:panelFormularioTipo"
                                    update=":formProducto:tabsProducto:seccionTipo :formProducto:resumenProducto :formProducto:growl"/>
                                <p:commandButton
                                    value="Cancelar"
                                    action="#{tipoProductoModel.asignacionesProducto.cancelar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionTipo :formProducto:resumenProducto :formProducto:growl"
                                    immediate="true"
                                    resetValues="true"/>
                                <p:commandButton
                                    value="Eliminar"
                                    action="#{tipoProductoModel.asignacionesProducto.eliminar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionTipo :formProducto:resumenProducto :formProducto:growl"
                                    rendered="#{tipoProductoModel.asignacionesProducto.estado == 'EDITAR'}"/>
                            </div>
                        </h:panelGroup>
                        <!-- TABLA PRODUCTO TIPO PRODUCTO -->
                        <h:panelGroup
                            id="panelTablaTipos"
                            layout="block"
                            rendered="#{modelo.seleccionado != null}"
                            styleClass="tablaContenedor">
                            <p:dataTable
                                id="tablaTipos"
                                value="#{tipoProductoModel.asignacionesProducto.asignaciones}"
                                var="pt"
                                paginator="true"
                                rows="5"
                                rowsPerPageTemplate="2,5,10,20"
                                paginatorPosition="bottom"
                                emptyMessage="No se encontraron asignaciones"
                                selectionMode="single"
                                selection="#{tipoProductoModel.asignacionesProducto.seleccionado}"
                                rowKey="#{pt.idProductoTipoProducto}">
                                <p:ajax
                                    event="rowSelect"
                                    listener="#{tipoProductoModel.asignacionesProducto.seleccionar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionTipo :formProducto:resumenProducto :formProducto:growl"/>
                                <p:column headerText="Producto">
                                    <h:outputText value="#{pt.idProducto.nombre}"/>
                                </p:column>
                                <p:column headerText="Tipo de Producto">
                                    <h:outputText value="#{pt.idTipoProducto.nombre}"/>
                                </p:column>
                                <p:column headerText="Estado">
                                    <h:outputText
                                        value="#{pt.activo ? 'ACTIVO' : 'INACTIVO'}"
                                        styleClass="#{pt.activo ? 'estadoActivo' : 'estadoInactivo'}"/>
                                </p:column>
                                <p:column headerText="Fecha de creación">
                                    <h:outputText value="#{pt.fechaCreacion}">
                                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>
                                <p:column headerText="Observaciones">
                                    <h:outputText value="#{pt.observaciones}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:tab>
                <!-- =========================
                     CARACTERÍSTICAS
                     ========================= -->
                <p:tab title="Características">
                    <h:panelGroup id="seccionCaracteristica" layout="block">
                        <p:commandButton
                            value="Nueva asignación"
                            action="#{caracteristicaModel.asignacionesProducto.nuevo}"
                            process="@this"
                            update=":formProducto:tabsProducto:seccionCaracteristica :formProducto:resumenProducto :formProducto:growl"
                            resetValues="true"
                            rendered="#{modelo.seleccionado != null}"/>
                        <!-- FORMULARIO -->
                        <h:panelGroup
                            id="panelFormularioCaracteristica"
                            layout="block"
                            rendered="#{caracteristicaModel.asignacionesProducto.estado != 'NINGUNO'}"
                            styleClass="formularioBloque">
                            <h2 class="crud-subtitulo">Característica del Producto</h2>
                            <div class="formGrid">
                                <!-- ID PRODUCTO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="idProductoCaracteristica" value="ID Producto:"/>
                                    <p:inputText
                                        id="idProductoCaracteristica"
                                        value="#{caracteristicaModel.asignacionesProducto.registro.idProducto.idProducto}"
                                        readonly="true"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- CARACTERÍSTICA -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="caracteristicaSeleccionada" value="Característica:"/>
                                    <p:selectOneMenu
                                        id="caracteristicaSeleccionada"
                                        value="#{caracteristicaModel.asignacionesProducto.idCatalogoSeleccionado}"
                                        converter="uuidConverter"
                                        filter="true"
                                        filterMatchMode="contains"
                                        filterPlaceholder="Buscar..."
                                        height="88"
                                        panelStyleClass="buscadorCompacto"
                                        disabled="#{caracteristicaModel.asignacionesProducto.estado != 'NUEVO'}"
                                        required="true"
                                        requiredMessage="Debe seleccionar una característica">
                                        <f:selectItem
                                            itemLabel="Buscar o seleccionar..."
                                            itemValue="#{null}"
                                            noSelectionOption="true"/>
                                        <f:selectItems
                                            value="#{caracteristicaModel.asignacionesProducto.disponibles}"
                                            var="caracteristica"
                                            itemValue="#{caracteristica.idCaracteristica}"
                                            itemLabel="#{caracteristica.nombre}"
                                            itemDisabled="#{!caracteristica.activo}"/>
                                        <p:ajax process="@this" update=":formProducto:growl"/>
                                    </p:selectOneMenu>
                                </div>
                                <!-- VALOR -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="valorCaracteristica" value="Valor:"/>
                                    <p:inputText
                                        id="valorCaracteristica"
                                        value="#{caracteristicaModel.asignacionesProducto.registro.valor}"
                                        required="true"
                                        requiredMessage="El valor es obligatorio"
                                        styleClass="inputCompleto"/>
                                </div>
                            </div>
                            <div class="botonesCrud">
                                <p:commandButton
                                    value="Guardar Característica"
                                    action="#{caracteristicaModel.asignacionesProducto.guardar}"
                                    process="@this :formProducto:tabsProducto:panelFormularioCaracteristica"
                                    update=":formProducto:tabsProducto:seccionCaracteristica :formProducto:resumenProducto :formProducto:growl"/>
                                <p:commandButton
                                    value="Cancelar"
                                    action="#{caracteristicaModel.asignacionesProducto.cancelar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionCaracteristica :formProducto:resumenProducto :formProducto:growl"
                                    immediate="true"
                                    resetValues="true"/>
                                <p:commandButton
                                    value="Eliminar"
                                    action="#{caracteristicaModel.asignacionesProducto.eliminar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionCaracteristica :formProducto:resumenProducto :formProducto:growl"
                                    rendered="#{caracteristicaModel.asignacionesProducto.estado == 'EDITAR'}"/>
                            </div>
                        </h:panelGroup>
                        <!-- TABLA -->
                        <h:panelGroup
                            id="panelTablaCaracteristicas"
                            layout="block"
                            rendered="#{modelo.seleccionado != null}"
                            styleClass="tablaContenedor">
                            <p:dataTable
                                id="tablaCaracteristicas"
                                value="#{caracteristicaModel.asignacionesProducto.asignaciones}"
                                var="pc"
                                paginator="true"
                                rows="5"
                                rowsPerPageTemplate="2,5,10,20"
                                paginatorPosition="bottom"
                                emptyMessage="No se encontraron características"
                                selectionMode="single"
                                selection="#{caracteristicaModel.asignacionesProducto.seleccionado}"
                                rowKey="#{pc.idProductoCaracteristica}">
                                <p:ajax
                                    event="rowSelect"
                                    listener="#{caracteristicaModel.asignacionesProducto.seleccionar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionCaracteristica :formProducto:resumenProducto :formProducto:growl"/>
                                <p:column headerText="Producto">
                                    <h:outputText value="#{pc.idProducto.nombre}"/>
                                </p:column>
                                <p:column headerText="Característica">
                                    <h:outputText value="#{pc.idCaracteristica.nombre}"/>
                                </p:column>
                                <p:column headerText="Tipo">
                                    <h:outputText value="#{pc.idCaracteristica.idTipoCaracteristica.nombre}"/>
                                </p:column>
                                <p:column headerText="Valor">
                                    <h:outputText value="#{pc.valor}"/>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:tab>
                <!-- =========================
     DESCUENTOS
     ========================= -->
                <p:tab title="Descuentos">
                    <h:panelGroup id="seccionDescuento" layout="block">
                        <p:commandButton
                            value="Nueva asignación"
                            action="#{descuentoModel.asignacionesProducto.nuevo}"
                            process="@this"
                            update=":formProducto:tabsProducto:seccionDescuento :formProducto:resumenProducto :formProducto:growl"
                            resetValues="true"
                            rendered="#{modelo.seleccionado != null}"/>
                        <!-- FORMULARIO DESCUENTO -->
                        <h:panelGroup
                            id="panelFormularioDescuento"
                            layout="block"
                            rendered="#{descuentoModel.asignacionesProducto.registro != null}"
                            styleClass="formularioBloque">
                            <h2 class="crud-subtitulo">Descuento del Producto</h2>
                            <div class="formGrid">
                                <!-- PRODUCTO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="productoDescuento" value="Producto:"/>
                                    <p:inputText
                                        id="productoDescuento"
                                        value="#{descuentoModel.asignacionesProducto.registro.idProducto.nombre}"
                                        readonly="true"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- DESCUENTO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="descuentoSeleccionado" value="Descuento:"/>
                                    <p:selectOneMenu
                                        id="descuentoSeleccionado"
                                        value="#{descuentoModel.asignacionesProducto.idCatalogoSeleccionado}"
                                        converter="uuidConverter"
                                        filter="true"
                                        filterMatchMode="contains"
                                        filterPlaceholder="Buscar..."
                                        height="88"
                                        panelStyleClass="buscadorCompacto"
                                        disabled="#{descuentoModel.asignacionesProducto.estado != 'NUEVO'}"
                                        required="true"
                                        requiredMessage="Debe seleccionar un descuento">
                                        <f:selectItem
                                            itemLabel="Buscar o seleccionar..."
                                            itemValue="#{null}"
                                            noSelectionOption="true"/>
                                        <f:selectItems
                                            value="#{descuentoModel.asignacionesProducto.disponibles}"
                                            var="descuento"
                                            itemValue="#{descuento.idDescuento}"
                                            itemLabel="#{descuento.nombre}"
                                            itemDisabled="#{!descuento.idTipoDescuento.activo}"/>
                                        <p:ajax
                                            process="@this"
                                            update=":formProducto:tabsProducto:maximoDescuento :formProducto:growl"/>
                                    </p:selectOneMenu>
                                </div>
                                <!-- PORCENTAJE -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="valorDescuento" value="Porcentaje:"/>
                                    <p:inputNumber
                                        id="valorDescuento"
                                        maxValue="100"
                                        value="#{descuentoModel.asignacionesProducto.registro.valor}"
                                        required="true"
                                        requiredMessage="El porcentaje es obligatorio"
                                        decimalPlaces="0"
                                        minValue="1"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- DESCUENTO MÁXIMO -->
                                <div class="campoGrupo">
                                    <p:outputLabel for="maximoDescuento" value="Máximo permitido:"/>
                                    <p:inputText
                                        id="maximoDescuento"
                                        value="#{descuentoModel.asignacionesProducto.catalogoSeleccionado.idTipoDescuento.descuentoMaximo}"
                                        readonly="true"
                                        placeholder="Seleccione un descuento"
                                        styleClass="inputCompleto"/>
                                </div>
                                <!-- FECHA INICIO -->
                                <div class="camposRelacionados">
                                    <div class="campoGrupo">
                                        <p:outputLabel for="fechaInicioDescuento" value="Desde:"/>
                                        <p:datePicker
                                            id="fechaInicioDescuento"
                                            value="#{descuentoModel.asignacionesProducto.registro.fechaInicio}"
                                            required="true"
                                            requiredMessage="La fecha de inicio es obligatoria"
                                            pattern="dd/MM/yyyy HH:mm"
                                            showTime="true"
                                            hourFormat="24"
                                            styleClass="inputCompleto"
                                            timeZone="America/El_Salvador"/>
                                    </div>
                                    <!-- FECHA FIN -->
                                    <div class="campoGrupo">
                                        <p:outputLabel for="fechaFinDescuento" value="Hasta:"/>
                                        <p:datePicker
                                            id="fechaFinDescuento"
                                            value="#{descuentoModel.asignacionesProducto.registro.fechaFin}"
                                            pattern="dd/MM/yyyy HH:mm"
                                            showTime="true"
                                            hourFormat="24"
                                            styleClass="inputCompleto"
                                            timeZone="America/El_Salvador"/>
                                    </div>
                                </div>
                            </div>
                            <div class="botonesCrud">
                                <p:commandButton
                                    value="Guardar Descuento"
                                    action="#{descuentoModel.asignacionesProducto.guardar}"
                                    process="@this :formProducto:tabsProducto:panelFormularioDescuento"
                                    update=":formProducto:tabsProducto:seccionDescuento :formProducto:resumenProducto :formProducto:growl"/>
                                <p:commandButton
                                    value="Cancelar"
                                    action="#{descuentoModel.asignacionesProducto.cancelar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionDescuento :formProducto:resumenProducto :formProducto:growl"
                                    immediate="true"
                                    resetValues="true"/>
                                <p:commandButton
                                    value="Eliminar"
                                    action="#{descuentoModel.asignacionesProducto.eliminar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionDescuento :formProducto:resumenProducto :formProducto:growl"
                                    immediate="true"
                                    rendered="#{descuentoModel.asignacionesProducto.seleccionado != null}"/>
                            </div>
                        </h:panelGroup>
                        <!-- TABLA GENERAL DE DESCUENTOS -->
                        <h:panelGroup
                            id="panelTablaDescuentos"
                            layout="block"
                            rendered="#{modelo.seleccionado != null}"
                            styleClass="tablaContenedor">
                            <p:dataTable
                                id="tablaDescuentos"
                                value="#{descuentoModel.asignacionesProducto.asignaciones}"
                                var="dp"
                                paginator="true"
                                rows="5"
                                rowsPerPageTemplate="2,5,10,20"
                                paginatorPosition="bottom"
                                emptyMessage="No se encontraron descuentos"
                                selectionMode="single"
                                selection="#{descuentoModel.asignacionesProducto.seleccionado}"
                                rowKey="#{dp.idDescuentoProducto}">
                                <p:ajax
                                    event="rowSelect"
                                    listener="#{descuentoModel.asignacionesProducto.seleccionar}"
                                    process="@this"
                                    update=":formProducto:tabsProducto:seccionDescuento :formProducto:resumenProducto :formProducto:growl"/>
                                <!-- PRODUCTO -->
                                <p:column
                                    headerText="Producto"
                                    filterBy="#{dp.idProducto.nombre}"
                                    filterMatchMode="contains"
                                    filterPlaceholder="Buscar producto">
                                    <h:outputText value="#{dp.idProducto.nombre}"/>
                                </p:column>
                                <!-- DESCUENTO -->
                                <p:column headerText="Descuento">
                                    <h:outputText
                                        value="#{dp.idDescuento.idTipoDescuento.nombre}: #{dp.valor}%, #{dp.idDescuento.nombre}"/>
                                </p:column>
                                <!-- DESDE -->
                                <p:column headerText="Desde">
                                    <h:outputText value="#{dp.fechaInicio}">
                                        <f:convertDateTime
                                            pattern="dd/MM/yyyy HH:mm"
                                            timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>
                                <!-- HASTA -->
                                <p:column headerText="Hasta">
                                    <h:outputText value="#{dp.fechaFin}">
                                        <f:convertDateTime
                                            pattern="dd/MM/yyyy HH:mm"
                                            timeZone="America/El_Salvador"/>
                                    </h:outputText>
                                </p:column>
                            </p:dataTable>
                        </h:panelGroup>
                    </h:panelGroup>
                </p:tab>
            </p:tabView>
        </h:form>
    </ui:define>
</ui:composition>
