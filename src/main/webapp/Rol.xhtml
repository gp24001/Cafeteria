<?xml version='1.0' encoding='UTF-8' ?>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    xmlns:bo="jakarta.faces.composite/botones"
    xmlns:ta="jakarta.faces.composite/tablas"
    template="/WEB-INF/templates/general.xhtml">
 
    <ui:param
        name="modelo" value="#{rolModel}"/>

    <ui:define name="contenido">

        <h:form id="formTabla">

            <p:growl id="growl" showDetail="true" life="5000"/>

            <div class="crud-botones">
                <bo:botonesArriba modelo="#{modelo}"/>
            </div>


            <h:panelGroup id="panelFormulario" layout="block" rendered="#{modelo.estado != 'NINGUNO'}" styleClass="formularioBloque">

                <h2 class="crud-subtitulo"> Datos del #{modelo.nombreBean} </h2>

                <div class="formGrid">

                    <div class="campoGrupo">
                        <p:outputLabel for="nombre" value="Nombre:"/>
                        <p:inputText id="nombre" value="#{modelo.registro.nombre}" styleClass="inputCompleto"/>
                    </div>

                    <div class="campoGrupo">
                        <p:outputLabel for="observaciones" value="Observaciones:"/>
                        <p:inputText id="observaciones" value="#{modelo.registro.observaciones}" styleClass="inputCompleto"/>
                    </div>

                    <div class="campoGrupo">
                        <p:outputLabel for="activo" value="Activo:"/>
                        <div class="checkboxContenedor">
                            <p:selectBooleanCheckbox id="activo" value="#{modelo.registro.activo}"/>
                        </div>
                    </div>

                </div>
            </h:panelGroup>
            
            <div class="tablaAcciones">
    <p:button value="Empleado Rol" outcome="EmpleadoRol" styleClass="botonFlat"/>
    <p:button value="Empleados" outcome="Empleado" styleClass="botonFlat"/>
</div>

            <div class="tablaContenedor">
                <ta:tablaGeneral modelo="#{modelo}" filas="5" opcionesFilas="2,5,10,20">

                    <p:column headerText="Nombre" field="nombre" filterBy="#{r.nombre}"
                        filterMatchMode="contains" filterPlaceholder="Buscar por nombre">
                        <h:outputText value="#{r.nombre}"/>
                    </p:column>

                    <p:column headerText="Observaciones" filterable="false">
                        <h:outputText value="#{r.observaciones}"/>
                    </p:column>

                    <p:column headerText="Activo" filterable="false">
                        <h:outputText value="#{r.activo ? 'Sí' : 'No'}"/>
                    </p:column>

                </ta:tablaGeneral>
            </div>

        </h:form>

    </ui:define>

</ui:composition>
