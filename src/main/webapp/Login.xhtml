<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets" xmlns:p="primefaces"
                template="/WEB-INF/templates/general.xhtml">
    <ui:param name="tituloPagina" value="Acceso de empleados"/>
    <ui:define name="contenido">
        <h:form id="acceso">
            <p:messages id="mensajes"/>
            <h2>Ingresar a Cafefe</h2>
            <p>Escribe el nombre del empleado con el que quieres acceder.</p>
            <div class="campoGrupo">
                <p:outputLabel for="nombre" value="Nombre del empleado:"/>
                <p:inputText id="nombre" value="#{accesoModel.nombre}" required="true"
                             requiredMessage="Escribe el nombre del empleado" maxlength="150"/>
            </div>
            <p:commandButton value="Ingresar" action="#{accesoModel.ingresar}" ajax="false"/>
        </h:form>
    </ui:define>
</ui:composition>
