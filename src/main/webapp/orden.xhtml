<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces"
      xmlns:btn="jakarta.faces.composite/botones"
      xmlns:tbl="jakarta.faces.composite/tablas">

<h:head>
    <title>Gestión de Órdenes</title>
</h:head>

<h:body>
    <h:form id="frmOrden">
        <p:growl id="messages" showDetail="true" />

        <h2>Gestión de Órdenes</h2>

        <!-- Componente Botones (botones/botonesArriba.xhtml) -->
        <btn:botonesArriba modelo="#{ordenModel}" actualizar="@form" />

        <p:spacer height="10" />

        <!-- Formulario condicional -->
        <p:panel header="Datos de la Orden" rendered="#{ordenModel.estado != 'NINGUNO'}">
            <h:panelGrid columns="2" cellpadding="5">
                <p:outputLabel for="fecha" value="Fecha Orden:" />
                <p:datePicker id="fecha" value="#{ordenModel.registro.fechaOrden}" showTime="true" pattern="dd/MM/yyyy HH:mm" required="true" />

                <p:outputLabel for="observacion" value="Observación:" />
                <p:inputTextarea id="observacion" value="#{ordenModel.registro.observacion}" rows="3" cols="30" />
            </h:panelGrid>
        </p:panel>

        <p:spacer height="10" />

        <!-- Componente Tabla (tablas/tablaGeneral.xhtml) -->
        <tbl:tablaGeneral modelo="#{ordenModel}" filas="5">
            <p:column headerText="ID Orden">
                <h:outputText value="#{r.idOrden}" />
            </p:column>

            <p:column headerText="Fecha" sortBy="#{r.fechaOrden}">
                <h:outputText value="#{r.fechaOrden}">
                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" />
                </h:outputText>
            </p:column>

            <p:column headerText="Observación" filterBy="#{r.observacion}">
                <h:outputText value="#{r.observacion}" />
            </p:column>
        </tbl:tablaGeneral>
    </h:form>
</h:body>
</html>
